<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#f8fafc" />
  
  <!-- Users Table -->
  <g transform="translate(50, 50)">
    <rect width="150" height="120" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="150" height="30" rx="5" fill="#3b82f6" />
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">users</text>
    <text x="10" y="50" font-family="sans-serif" font-size="12">id (PK)</text>
    <text x="10" y="70" font-family="sans-serif" font-size="12">email</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12">role</text>
    <text x="10" y="110" font-family="sans-serif" font-size="12">display_name</text>
  </g>

  <!-- Projects Table -->
  <g transform="translate(350, 50)">
    <rect width="150" height="120" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="150" height="30" rx="5" fill="#3b82f6" />
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">projects</text>
    <text x="10" y="50" font-family="sans-serif" font-size="12">id (PK)</text>
    <text x="10" y="70" font-family="sans-serif" font-size="12">owner_id (FK)</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12">name</text>
    <text x="10" y="110" font-family="sans-serif" font-size="12">status</text>
  </g>

  <!-- Tasks Table -->
  <g transform="translate(650, 50)">
    <rect width="150" height="140" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="150" height="30" rx="5" fill="#3b82f6" />
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">tasks</text>
    <text x="10" y="50" font-family="sans-serif" font-size="12">id (PK)</text>
    <text x="10" y="70" font-family="sans-serif" font-size="12">project_id (FK)</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12">name</text>
    <text x="10" y="110" font-family="sans-serif" font-size="12">status</text>
    <text x="10" y="130" font-family="sans-serif" font-size="12">start_date</text>
  </g>

  <!-- Inventory Table -->
  <g transform="translate(350, 250)">
    <rect width="150" height="120" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="150" height="30" rx="5" fill="#3b82f6" />
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">inventory</text>
    <text x="10" y="50" font-family="sans-serif" font-size="12">id (PK)</text>
    <text x="10" y="70" font-family="sans-serif" font-size="12">project_id (FK)</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12">category_id (FK)</text>
    <text x="10" y="110" font-family="sans-serif" font-size="12">quantity</text>
  </g>

  <!-- Team Members Table -->
  <g transform="translate(50, 250)">
    <rect width="150" height="100" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="150" height="30" rx="5" fill="#3b82f6" />
    <text x="75" y="20" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold">team_members</text>
    <text x="10" y="50" font-family="sans-serif" font-size="12">id (PK)</text>
    <text x="10" y="70" font-family="sans-serif" font-size="12">project_id (FK)</text>
    <text x="10" y="90" font-family="sans-serif" font-size="12">user_id (FK)</text>
  </g>

  <!-- Relationships -->
  <path d="M 200 110 L 350 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 500 110 L 650 110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 425 170 L 425 250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 125 170 L 125 250" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 350 280 L 200 280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
