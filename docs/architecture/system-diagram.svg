<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" />
  
  <!-- Client Side -->
  <rect x="50" y="100" width="200" height="300" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <text x="150" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Client (Frontend)</text>
  
  <rect x="75" y="140" width="150" height="40" rx="5" fill="#eff6ff" stroke="#60a5fa" />
  <text x="150" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e40af">React 18 + TS</text>
  
  <rect x="75" y="200" width="150" height="40" rx="5" fill="#eff6ff" stroke="#60a5fa" />
  <text x="150" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e40af">Zustand (State)</text>
  
  <rect x="75" y="260" width="150" height="40" rx="5" fill="#eff6ff" stroke="#60a5fa" />
  <text x="150" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e40af">Tailwind CSS</text>
  
  <rect x="75" y="320" width="150" height="40" rx="5" fill="#eff6ff" stroke="#60a5fa" />
  <text x="150" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e40af">Vite (Build)</text>

  <!-- Server Side (Supabase) -->
  <rect x="550" y="100" width="200" height="300" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <text x="650" y="80" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e293b">Backend (Supabase)</text>
  
  <rect x="575" y="140" width="150" height="40" rx="5" fill="#ecfdf5" stroke="#34d399" />
  <text x="650" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#065f46">PostgreSQL (DB)</text>
  
  <rect x="575" y="200" width="150" height="40" rx="5" fill="#ecfdf5" stroke="#34d399" />
  <text x="650" y="225" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#065f46">GoTrue (Auth)</text>
  
  <rect x="575" y="260" width="150" height="40" rx="5" fill="#ecfdf5" stroke="#34d399" />
  <text x="650" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#065f46">Storage</text>
  
  <rect x="575" y="320" width="150" height="40" rx="5" fill="#ecfdf5" stroke="#34d399" />
  <text x="650" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#065f46">Realtime</text>

  <!-- Connections -->
  <path d="M 250 250 L 550 250" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)" />
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">HTTPS / WSS</text>
  
  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
</svg>
