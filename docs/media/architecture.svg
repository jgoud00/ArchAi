<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; }
    .text { font-family: sans-serif; fill: white; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .label { font-family: sans-serif; fill: #94a3b8; font-size: 12px; text-anchor: middle; }
    .flow { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 10; }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .flow-anim { animation: dash 1s linear infinite; }
  </style>
  
  <!-- Client -->
  <rect x="50" y="150" width="120" height="80" class="node" />
  <text x="110" y="190" class="text">React Client</text>
  
  <!-- Supabase -->
  <rect x="350" y="100" width="200" height="200" class="node" stroke="#10b981" fill="#0f172a" stroke-dasharray="5,5" />
  <text x="450" y="120" class="text" fill="#10b981">Supabase</text>
  
  <!-- Services inside Supabase -->
  <rect x="370" y="140" width="160" height="40" class="node" stroke="#8b5cf6" />
  <text x="450" y="160" class="text">Auth (GoTrue)</text>
  
  <rect x="370" y="200" width="160" height="40" class="node" stroke="#f59e0b" />
  <text x="450" y="220" class="text">Database (Postgres)</text>
  
  <rect x="370" y="260" width="160" height="40" class="node" stroke="#ec4899" />
  <text x="450" y="280" class="text">Storage</text>
  
  <!-- Connections -->
  <path d="M170 190 L350 190" class="flow flow-anim" />
  
  <!-- Labels -->
  <text x="260" y="180" class="label">REST / Realtime</text>
  
</svg>
