<svg width="800" height="20" viewBox="0 0 800 20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>
  <rect x="0" y="8" width="800" height="2" fill="url(#grad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    <animate attributeName="width" values="0;800;0" dur="5s" repeatCount="indefinite" />
    <animate attributeName="x" values="400;0;400" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
