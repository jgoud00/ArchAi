<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="560" height="140" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2" rx="8"/>
  
  <!-- Status Cards -->
  <g font-family="sans-serif">
    <rect x="40" y="40" width="100" height="80" fill="#667eea" rx="4"/>
    <text x="90" y="90" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Active</text>
    
    <rect x="160" y="50" width="100" height="70" fill="#34d399" rx="4"/>
    <text x="210" y="95" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Planning</text>
    
    <rect x="280" y="60" width="100" height="60" fill="#fbbf24" rx="4"/>
    <text x="330" y="95" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Review</text>
    
    <rect x="400" y="70" width="140" height="50" fill="#f87171" rx="4"/>
