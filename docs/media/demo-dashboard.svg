<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#1e293b" rx="8" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="20">Dashboard Preview</text>
  <circle cx="200" cy="150" r="10" stroke="#3b82f6" stroke-width="2" fill="none">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
