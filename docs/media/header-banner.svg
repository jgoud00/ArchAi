<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Main Title -->
  <text x="400" y="80" font-size="48" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif" filter="url(#dropShadow)">
    ArchitectAI
  </text>
  <!-- Tagline -->
  <text x="400" y="130" font-size="24" fill="#e0e7ff" text-anchor="middle" font-family="Arial, sans-serif">
    Enterprise Construction Management
  </text>
  
  <!-- Features Row -->
  <g transform="translate(0, 20)">
    <!-- Feature 1: Building -->
    <rect x="80" y="160" width="120" height="100" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="140" cy="185" r="20" fill="#fbbf24"/>
    <text x="140" y="280" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Streamline</text>
    
    <!-- Feature 2: Chart -->
    <rect x="340" y="160" width="120" height="100" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="400" cy="185" r="20" fill="#34d399"/>
    <text x="400" y="280" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Visualize</text>
    
    <!-- Feature 3: Budget -->
    <rect x="600" y="160" width="120" height="100" fill="rgba(255,255,255,0.1)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="660" cy="185" r="20" fill="#f87171"/>
    <text x="660" y="280" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Control</text>
  </g>
</svg>
