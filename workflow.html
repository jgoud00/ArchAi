<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArchitectAI - Construction Management Workflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Color Palette */
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --secondary: #8b5cf6;
      --accent: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      
      /* Section Colors */
      --auth-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --project-bg: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      --budget-bg: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      --doc-bg: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --issue-bg: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      --timeline-bg: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --inventory-bg: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      --output-bg: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      
      /* Neutral Colors */
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      
      /* Spacing */
      --spacing-xs: 0.5rem;
      --spacing-sm: 1rem;
      --spacing-md: 1.5rem;
      --spacing-lg: 2rem;
      --spacing-xl: 3rem;
      
      /* Typography */
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 2rem;
      --font-size-4xl: 2.5rem;
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: var(--spacing-md) var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.9);
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--primary);
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--auth-bg);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      gap: var(--spacing-sm);
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: var(--font-size-sm);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* Main Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing-xl) var(--spacing-lg);
    }

    /* Workflow SVG Container */
    .workflow-container {
      background: var(--bg-secondary);
      border-radius: var(--radius-2xl);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-xl);
      margin: var(--spacing-lg) 0;
      overflow: hidden;
      position: relative;
    }

    .workflow-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .workflow-svg {
      width: 100%;
      height: auto;
      display: block;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* SVG Styles */
    .workflow-svg .section-card {
      filter: drop-shadow(var(--shadow-md));
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .workflow-svg .section-card:hover {
      filter: drop-shadow(var(--shadow-lg));
      transform: translateY(-2px);
    }

    .workflow-svg .section-title {
      font-family: var(--font-family);
      font-size: 18px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }

    .workflow-svg .section-text {
      font-family: var(--font-family);
      font-size: 13px;
      fill: var(--text-primary);
      font-weight: 500;
    }

    .workflow-svg .section-text-bold {
      font-weight: 600;
      fill: var(--text-primary);
    }

    .workflow-svg .section-text-light {
      fill: var(--text-secondary);
      font-size: 12px;
    }

    .workflow-svg .arrow {
      stroke-width: 3;
      fill: none;
      stroke: var(--text-secondary);
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .workflow-svg .arrow:hover {
      stroke: var(--primary);
      opacity: 1;
      stroke-width: 4;
    }

    .workflow-svg .loop-arrow {
      stroke-width: 3;
      fill: none;
      stroke: var(--primary);
      opacity: 0.7;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .workflow-svg .icon-group {
      transition: all 0.3s ease;
    }

    .workflow-svg .section-card:hover .icon-group {
      transform: scale(1.1);
    }

    /* Footer */
    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: var(--spacing-lg);
      margin-top: var(--spacing-xl);
      text-align: center;
      color: var(--text-secondary);
      font-size: var(--font-size-sm);
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .container {
        padding: var(--spacing-md);
      }

      .workflow-container {
        padding: var(--spacing-md);
      }

      .workflow-svg {
        min-height: 1200px;
      }
    }

    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: var(--spacing-sm);
      }

      .workflow-svg .section-title {
        font-size: 14px;
      }

      .workflow-svg .section-text {
        font-size: 11px;
      }

      .workflow-svg .section-text-light {
        font-size: 10px;
      }
    }

    /* Scroll Snap */
    html {
      scroll-behavior: smooth;
    }

    .workflow-container {
      scroll-snap-align: start;
    }

    /* Loading Animation */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .workflow-container {
      animation: slideUp 0.6s ease-out;
    }
  </style>
</head>
<body>
  <!-- Header -->

    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">A</div>
        <span>ArchitectAI</span>
      </div>
      <div class="header-actions">

  </header>

        <!-- Background -->

  <script>
    // Add interactive hover effects
    document.querySelectorAll('.section-card').forEach(card => {
      card.addEventListener('mouseenter', function() {
        this.style.opacity = '1';
      });
      card.addEventListener('mouseleave', function() {
        this.style.opacity = '0.95';
      });
    });

    // Smooth scroll on arrow click
    document.querySelectorAll('.arrow').forEach(arrow => {
      arrow.addEventListener('click', function() {
        const nextCard = this.parentElement.nextElementSibling?.querySelector('.section-card');
        if (nextCard) {
          nextCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      });
    });
  </script>
