<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B8D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Geometric blueprint cube icon -->
  <g id="icon">
    <!-- Cube outline - thin lines -->
    <path d="M8 22 L8 10 L18 4 L28 10 L28 22 L18 28 Z" fill="none" stroke="#0A1B2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 28 L18 16 L28 10" fill="none" stroke="#0A1B2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 22 L18 16 L18 28" fill="none" stroke="#0A1B2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Blueprint grid lines inside cube -->
    <line x1="13" y1="14" x2="23" y2="19" stroke="url(#cyanGradient)" stroke-width="0.7" opacity="0.7"/>
    <line x1="13" y1="19" x2="23" y2="24" stroke="url(#cyanGradient)" stroke-width="0.7" opacity="0.7"/>
    <line x1="10.5" y1="16" x2="10.5" y2="22" stroke="url(#cyanGradient)" stroke-width="0.7" opacity="0.7"/>
    <line x1="25.5" y1="13" x2="25.5" y2="19" stroke="url(#cyanGradient)" stroke-width="0.7" opacity="0.7"/>
    
    <!-- Smart building outline (second element) -->
    <rect x="32" y="10" width="7" height="12" fill="none" stroke="#0A1B2E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="12" x2="34" y2="20" stroke="url(#cyanGradient)" stroke-width="0.6" opacity="0.5"/>
    <line x1="37.5" y1="12" x2="37.5" y2="20" stroke="url(#cyanGradient)" stroke-width="0.6" opacity="0.5"/>
    <line x1="32" y1="14" x2="39" y2="14" stroke="url(#cyanGradient)" stroke-width="0.6" opacity="0.5"/>
    <line x1="32" y1="18" x2="39" y2="18" stroke="url(#cyanGradient)" stroke-width="0.6" opacity="0.5"/>
  </g>
  
  <!-- Wordmark -->
  <text x="48" y="38" font-family="system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#0A1B2E" letter-spacing="-0.5px">
    Architect<tspan fill="url(#cyanGradient)">AI</tspan>
  </text>
</svg>

